version: '3.8'
services:
  backend:
    build: ./backend
    ports: ["4000:4000"]
    environment:
      - NODE_ENV=production
      - PORT=4000
  frontend:
    build: ./frontend
    ports: ["3000:80"]
    depends_on: [backend]
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: infiniteai
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
    volumes: [pgdata:/var/lib/postgresql/data]
volumes:
  pgdata:
